spring.application.name=flight-ingestion

# Embedded H2 - no external infrastructure needed
spring.datasource.url=jdbc:h2:mem:flightsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# schema.sql is applied on every startup (and on every test context)
spring.sql.init.mode=always

# Browse the data at http://localhost:8080/h2-console (JDBC URL above, user sa)
spring.h2.console.enabled=true

# JSON: ISO-8601 dates, not epoch millis
spring.jackson.serialization.write-dates-as-timestamps=false

# POST /flights/import file upload limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

server.port=8080

# Downstream dependency: airport-service (see ../airport-service).
# Integration tests replace this URL with a WireMock server.
airport-service.base-url=http://localhost:8081
airport-service.timeout=2s
