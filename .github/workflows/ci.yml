# CI + CD pipeline. Jobs 1-3 match the Jenkinsfile; jobs 4-5 (deploy + UI tests) are GitHub-only.
# Each job is a quality gate; `needs:` makes a job wait for (and require) the previous one.

name: CI

# CI  (jobs 1-3): every PR and every push to main.
# CD  (jobs 4-5): only after a merge to main - a PR must never deploy anything.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-contract:
    name: Unit + contract tests (consumer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
      - name: Hand the contract to the provider job
        uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: pacts/
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/

  provider-verification:
    name: Contract verification (provider)
    needs: unit-and-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: pacts
          path: pacts/
      - run: mvn -B test
        working-directory: airport-service

  integration-and-coverage:
    name: Integration tests + coverage gate
    needs: provider-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/failsafe-reports/
            target/site/jacoco/
            target/allure-results/
      # "Build once, deploy many": the jar that passed every gate is the one we deploy.
      - name: Save the tested build
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/flight-ingestion-*.jar

  # ---------------- Continuous Delivery ----------------

  deploy-qa:
    name: Deploy to QA (simulated)
    needs: integration-and-coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A GitHub Environment: shows up under Deployments, can hold QA-only
    # variables/secrets, and can require a manual approval before this job runs.
    environment:
      name: qa
      url: https://www.saucedemo.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
      - name: Deploy
        run: |
          ls -l *.jar
          echo "Deploying build ${GITHUB_SHA::7} to QA."
          echo "Simulated: a real job would copy this jar/image to the QA server and restart it."

  ui-tests-qa:
    name: UI tests on QA
    needs: deploy-qa
    # Runs a workflow that lives in ANOTHER repo, as a job of this pipeline.
    # If the UI tests fail, this pipeline goes red.
    uses: annkohnovich/playwright-practice/.github/workflows/ui-tests.yml@main
    with:
      environment: qa
      browser: chromium
